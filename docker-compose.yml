version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: wlafayettekorea-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: wlk_db
      MARIADB_USER: wlk_user
      MARIADB_PASSWORD: wlk_password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wlafayettekorea-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=mysql://wlk_user:wlk_password@db:3306/wlk_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
